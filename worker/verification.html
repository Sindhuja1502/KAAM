<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kaam | Worker Login</title>
  <link rel="stylesheet" href="verification.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="form-container">
    <h2><i class="fa-solid fa-screwdriver-wrench"></i> Worker Login</h2>
    
    <form>
      <div class="form-group">
        <label for="phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
        <input type="text" id="phone" placeholder="Enter your phone number" required>
      </div>

      <div class="form-group">
        <label for="name"><i class="fa-solid fa-user"></i> Full Name / ID</label>
        <input type="text" id="name" placeholder="Enter your name or ID" required>
      </div>

      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <div class="form-group">
        <label for="location"><i class="fa-solid fa-location-dot"></i> Select Location</label>
        <select id="location" required>
          <option value="">Choose your area</option>
          <option>Hyderabad</option>
          <option>Delhi</option>
          <option>Mumbai</option>
          <option>Bangalore</option>
        </select>
      </div>

      <button type="submit">Login / Signup</button>
    </form>
  </div>

  <script src="worker.js"></script>
</body>
</html>
